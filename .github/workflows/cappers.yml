name: cappers
# 👥 Каперы каждый час (решение пользователя 11.11.2026 23:53) — football/caprun.py; свежая ставка капера → прогон её бота.
on:
  schedule:
    - cron: '22 2-22 * * *'   # :22 — между теннисом (:07) и футболом (:37); 17.11 Г0а: тихое окно 04:00–07:00 Ташкента (UTC 23–01) — без запусков
  workflow_dispatch:
    inputs:
      cap_test:
        description: 'Тест уведомления каперов (1)'
        default: ''
        required: false
permissions:
  contents: write
  actions: write
concurrency:
  group: football             # одна очередь с футболом: обе пишут football/data
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            football
            hockey
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/cache@v4          # 14.11 экономия: готовое окружение Python вместо pip install (−10 с)
        id: pyc
        with:
          path: ${{ env.pythonLocation }}
          key: pyenv-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('requirements-cloud.txt') }}
      - if: steps.pyc.outputs.cache-hit != 'true'
        run: pip install -q -r requirements-cloud.txt
      - name: Cappers
        id: cap
        working-directory: football
        run: python caprun.py
        env:
          CLOUD: '1'
          FOOT_BOT_TOKEN: ${{ secrets.FOOT_BOT_TOKEN }}
          TENNIS_BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ALLOWED_USERS: ${{ secrets.ALLOWED_USERS }}
          CAP_TEST: ${{ github.event.inputs.cap_test }}
          GH_TOKEN: ${{ github.token }}                   # 16.11: сторож ключевых часов читает прогоны daily/football (actions: read)
      - name: Save data
        if: always()
        run: |
          git config user.name "cappers-bot"
          git config user.email "cappers-bot@users.noreply.github.com"
          git add football/data
          git diff --cached --quiet && exit 0
          git commit -m "Cappers $(date -u +%F' '%H:%M)"
          ok=0; for i in 1 2 3; do (git pull --rebase -X theirs --autostash origin main || { git rebase --abort; false; }) && git push && ok=1 && break; sleep 5; done; [ $ok = 1 ]
      - name: Day pick reaction
        if: steps.cap.outputs.dispatch != ''
        run: for w in ${{ steps.cap.outputs.dispatch }}; do gh workflow run "$w" --ref main --repo "${{ github.repository }}"; done
        env:
          GH_TOKEN: ${{ github.token }}
