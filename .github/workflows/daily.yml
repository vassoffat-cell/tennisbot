name: tennis
on:
  schedule:
  - cron: '7 1-23/2 * * *'     # :07, а не :00 — в начале часа GitHub задерживает запуски на 40–65 мин (замер 08–10.11)
  - cron: '27 3 * * *'      # резерв 08:27 Ташкента — утренняя ставка дня (12.11 GitHub задержал 08:07 на 45+ мин)
  - cron: '7 6 * * *'       # 11:07 Ташкента — суточный отчёт тенниса (решение 14.11: отчёт в 11:00)
  - cron: '27 6 * * *'      # резерв 11:27
  - cron: '27 7 * * *'      # резерв 12:27 — отчёт и ставка дня хоккея (хоккейные сутки с 12:00)
  workflow_dispatch:
    inputs:
      resend_day:
        description: 'Повтор отчёта за сутки ГГГГ-ММ-ДД'
        default: ''
        required: false
      resend_week:
        description: 'Повтор / тест недельного отчёта: последний день недели ГГГГ-ММ-ДД'
        default: ''
        required: false
permissions:
  contents: write
concurrency:
  group: tennis
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-cloud.txt
      - run: pip install -r requirements-cloud.txt
      - name: Google key
        run: printf '%s' "$GOOGLE_CREDENTIALS_JSON" > service_account.json
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
      - name: Inbox, retrain, forecast, settle
        run: python autorun.py auto
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ALLOWED_USERS: ${{ secrets.ALLOWED_USERS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
          CLOUD: '1'
          RESEND_DAY: ${{ github.event.inputs.resend_day }}
          RESEND_WEEK: ${{ github.event.inputs.resend_week }}
      - name: Save data and model
        if: always()
        run: |
          git config user.name "tennis-bot"
          git config user.email "tennis-bot@users.noreply.github.com"
          mkdir -p data/espn && git add data state hockey/data
          git diff --cached --quiet && exit 0
          git commit -m "Data update $(date -u +%F)"
          ok=0; for i in 1 2 3; do (git pull --rebase -X theirs --autostash origin main || { git rebase --abort; false; }) && git push && ok=1 && break; sleep 5; done; [ $ok = 1 ]
