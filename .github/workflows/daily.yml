name: tennis
on:
  schedule:
  - cron: '7 1-23/2 * * *'     # :07 каждые 2 ч круглые сутки (ночью — НХЛ: правки и цена закрытия перед матчами 03:00–08:00; 14.11 ночь возвращена)
  - cron: '27 3 * * *'      # резерв 08:27 Ташкента — утренняя ставка дня (12.11 GitHub задержал 08:07 на 45+ мин)
  - cron: '7 6 * * *'       # 11:07 Ташкента — суточный отчёт тенниса (решение 14.11: отчёт в 11:00)
  - cron: '27 6 * * *'      # резерв 11:27
  - cron: '27 7 * * *'      # резерв 12:27 — отчёт и ставка дня хоккея (хоккейные сутки с 12:00)
  workflow_dispatch:
    inputs:
      resend_day:
        description: 'Повтор отчёта за сутки ГГГГ-ММ-ДД'
        default: ''
        required: false
      resend_week:
        description: 'Повтор / тест недельного отчёта: последний день недели ГГГГ-ММ-ДД'
        default: ''
        required: false
      resend_picks:
        description: 'ТЗ-006: заново прислать все ставки дня текущих суток (1)'
        default: ''
        required: false
      prof:
        description: 'Профиль времени прогона (1)'
        default: ''
        required: false
permissions:
  contents: write
  actions: write              # 16.11: сторож каперов запускает cappers.yml (разрешение пользователя)
concurrency:
  group: tennis
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Сторож каперов (Г0, аудит 16.11)
        # GitHub пропускает плановые :22 каперов (16.11: перерывы 92–107 мин). Любой прогон тенниса/футбола (и пропущенный шлюзом)
        # проверяет: последний прогон cappers.yml > 70 мин назад и нет в очереди → запуск. Минуты — только на пропущенный час.
        continue-on-error: true
        run: |
          js=$(gh api "repos/${{ github.repository }}/actions/workflows/cappers.yml/runs?per_page=5")
          last=$(echo "$js" | jq -r '[.workflow_runs[].created_at]|max // "1970-01-01T00:00:00Z"')
          busy=$(echo "$js" | jq '[.workflow_runs[]|select(.status=="queued" or .status=="in_progress")]|length')
          age=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 60 ))
          echo "👥 каперы: последний прогон $age мин назад, в очереди ${busy:-0}"
          if [ "$age" -gt 70 ] && [ "${busy:-0}" -eq 0 ]; then
            gh api -X POST "repos/${{ github.repository }}/actions/workflows/cappers.yml/dispatches" -f ref=main && echo "🛡 каперы: перерыв $age мин — запуск"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Gate — экономия минут (14.11)
        id: gate
        if: github.event_name == 'schedule'
        run: |
          since=$(date -u -d '-35 min' +%Y-%m-%dT%H:%M:%SZ)
          # ключевые часы (ставка дня 08, отчёты 11/12): считается только прогон ПОСЛЕ начала часа — иначе работа часа не сделана
          h=$(TZ=Asia/Tashkent date +%H); case " 08 11 12 " in *" $h "*) since2=$(date -u -d "$(TZ=Asia/Tashkent date '+%Y-%m-%d %H:00') +0500" +%Y-%m-%dT%H:%M:%SZ);; *) since2=$since;; esac
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/daily.yml/runs?status=success&created=>=$since&per_page=20" -q "[.workflow_runs[]|select(.id != ${{ github.run_id }} and .run_started_at >= \"$since2\" and ((.updated_at|fromdate) - (.run_started_at|fromdate)) > 40)]|length" || echo 0)
          if [ "${n:-0}" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "⏭ экономия: полный успешный прогон за 35 мин ($n) — пропуск (пропуски не считаются: > 40 с)"; fi
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/checkout@v5
        if: steps.gate.outputs.skip != 'true'
      - uses: actions/setup-python@v6
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: '3.13'
      - uses: actions/cache@v4          # 14.11 экономия: готовое окружение Python вместо pip install (−10 с)
        id: pyc
        if: steps.gate.outputs.skip != 'true'
        with:
          path: ${{ env.pythonLocation }}
          key: pyenv-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('requirements-cloud.txt') }}
      - if: steps.gate.outputs.skip != 'true' && steps.pyc.outputs.cache-hit != 'true'
        run: pip install -q -r requirements-cloud.txt
      - name: Google key
        if: steps.gate.outputs.skip != 'true'
        run: printf '%s' "$GOOGLE_CREDENTIALS_JSON" > service_account.json
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
      - name: Inbox, retrain, forecast, settle
        if: steps.gate.outputs.skip != 'true'
        run: python autorun.py auto
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ALLOWED_USERS: ${{ secrets.ALLOWED_USERS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
          CLOUD: '1'
          PROF_CPU: ${{ github.event.inputs.prof }}
          PYTHONUNBUFFERED: '1'     # ⏱ 14.11: строки журнала со своим временем — видно длительность этапов
          RESEND_DAY: ${{ github.event.inputs.resend_day }}
          RESEND_PICKS: ${{ github.event.inputs.resend_picks }}
          RESEND_WEEK: ${{ github.event.inputs.resend_week }}
      - name: Save data and model
        if: always() && steps.gate.outputs.skip != 'true'
        run: |
          git config user.name "tennis-bot"
          git config user.email "tennis-bot@users.noreply.github.com"
          mkdir -p data/espn && git add data state hockey/data
          git diff --cached --quiet && exit 0
          git commit -m "Data update $(date -u +%F)"
          ok=0; for i in 1 2 3; do (git pull --rebase -X theirs --autostash origin main || { git rebase --abort; false; }) && git push && ok=1 && break; sleep 5; done; [ $ok = 1 ]
