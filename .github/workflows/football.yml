name: football
# 16.11 аудит: репетиция помечается в названии прогона — шлюз, health и сторож ключевых часов не считают её полным прогоном
run-name: ${{ (format('{0}', github.event.inputs.rehearse) != '' || github.event.schedule == '13 16 * * *') && 'football rehearse' || 'football' }}
on:
  schedule:
    # 18.11 ТЗ-007 шаг 2б: матчи — прогоны по плану (Р7, Apps Script planTick_); cron — резерв раз в 4 ч + ключевые часы
    - cron: '37 3-19/2 * * *'   # 27.11 22:07 (Ц19, решение пользователя): :37 снова каждые 2 ч — 08:37, 10:37 … 00:37 Ташкента (с 18.11 было раз в 4 ч)
    # 18.11 18:30: резервы 07:47 и 11:57 убраны — страхуют keyTick_ (Apps Script) и Р4 (каперы, +25 мин)
    - cron: '17 6 * * *'      # 25.11 Р8: 11:17 — страховка отчёта 11:15 (основной запуск — keyTick_)
    - cron: '37 6 * * *'      # 11:37 Ташкента — страховка ⚽1 11:30 (Р8)
    - cron: '2 12 * * 1'      # 28.11 Р9: пн 17:02 — крайний срок старта суток (mgate.DEADLINE)
    - cron: '13 16 * * *'     # 21:13 Ташкента — 16.11: автоматическая репетиция завтрашних суток (без кф и отправок; ⚠️ только при проблеме)
  workflow_dispatch:
    inputs:
      resend_day:
        description: 'Повтор отчёта за сутки ГГГГ-ММ-ДД'
        default: ''
        required: false
      resend_week:
        description: 'Повтор / тест недельного отчёта: последний день недели ГГГГ-ММ-ДД'
        default: ''
        required: false
      resend_picks:
        description: 'ТЗ-006: заново прислать все ставки дня текущих суток (1)'
        default: ''
        required: false
      rehearse:
        description: 'Репетиция будущих суток без отправок: ГГГГ-ММ-ДД или ГГГГ-ММ-ДД,odds (16.11)'
        default: ''
        required: false
permissions:
  contents: write
  actions: write              # 16.11: сторож каперов запускает cappers.yml (разрешение пользователя)
concurrency:
  group: football
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Сторож каперов (Г0, аудит 16.11)
        # GitHub пропускает плановые :22 каперов (16.11: перерывы 92–107 мин). Любой прогон тенниса/футбола (и пропущенный шлюзом)
        # проверяет: последний прогон cappers.yml > 70 мин назад и нет в очереди → запуск. Минуты — только на пропущенный час.
        continue-on-error: true
        run: |
          js=$(gh api "repos/${{ github.repository }}/actions/workflows/cappers.yml/runs?per_page=5")
          last=$(echo "$js" | jq -r '[.workflow_runs[].created_at]|max // "1970-01-01T00:00:00Z"')
          busy=$(echo "$js" | jq '[.workflow_runs[]|select(.status=="queued" or .status=="in_progress")]|length')
          age=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 60 ))
          echo "👥 каперы: последний прогон $age мин назад, в очереди ${busy:-0}"
          hh=$(TZ=Asia/Tashkent date +%H); case " 03 04 05 06 07 08 09 10 11 12 13 14 " in *" $hh "*) quiet=1;; *) quiet=0;; esac   # 19.11 Г0б: тихое окно 03:00–15:00
          if [ "$quiet" = 0 ] && [ "$age" -gt 70 ] && [ "${busy:-0}" -eq 0 ]; then
            gh api -X POST "repos/${{ github.repository }}/actions/workflows/cappers.yml/dispatches" -f ref=main && echo "🛡 каперы: перерыв $age мин — запуск"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Репетиция в окне плана (аудит 23.11)
        # 22.11: репетиция 21:13 опоздала до 21:56 и попала в окно плана 22:00 (T−40м ×2) — planTick_ (Apps Script) засчитал её
        # как прогон окна и не запустил полный → окно без прогона (health «план по матчам»). Репетиция в окне — запускает полный прогон сама.
        if: github.event.schedule == '13 16 * * *' || github.event.inputs.rehearse != ''
        continue-on-error: true
        run: |
          pa=$(gh api "repos/${{ github.repository }}/contents/football/data/plan.json" -H 'Accept: application/vnd.github.raw' 2>/dev/null | jq -r --arg n "$(date -u -d '+15 min' '+%Y-%m-%d %H:%M')" --arg m "$(date -u -d '-10 min' '+%Y-%m-%d %H:%M')" '[.groups[]|select(.at <= $n and .hi >= $m)|.at]|max // empty' 2>/dev/null || true)
          if [ -n "$pa" ]; then
            gh api -X POST "repos/${{ github.repository }}/actions/workflows/football.yml/dispatches" -f ref=main && echo "📅 репетиция в окне плана $pa UTC — запущен полный прогон"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Gate — экономия минут (14.11)
        id: gate
        if: github.event_name == 'schedule' && github.event.schedule != '13 16 * * *'
        run: |
          since=$(date -u -d '-35 min' +%Y-%m-%dT%H:%M:%SZ)
          # 25.11 Р8: ключевые слоты (Ташкент) — в течение часа после слота считается только прогон ПОСЛЕ его начала
          since2=$since; nowm=$(( 10#$(TZ=Asia/Tashkent date +%H) * 60 + 10#$(TZ=Asia/Tashkent date +%M) ))
          for sl in 11:15 11:30 17:00; do sm=$(( 10#${sl%:*} * 60 + 10#${sl#*:} )); if [ $nowm -ge $sm ] && [ $nowm -lt $((sm + 60)) ]; then s1=$(date -u -d "$(TZ=Asia/Tashkent date +%Y-%m-%d) $sl +0500" +%Y-%m-%dT%H:%M:%SZ); [[ "$s1" > "$since2" ]] && since2=$s1; fi; done
          # 17.11 ТЗ-007 шаг 2: окно плана по матчам открыто или откроется ≤ 15 мин — считается только полный прогон ПОСЛЕ начала окна
          # (окно в будущем → since2 в будущем → не пропускаем: Apps Script planTick_ засчитает этот запуск, значит он должен быть полным)
          pa=$(gh api "repos/${{ github.repository }}/contents/football/data/plan.json" -H 'Accept: application/vnd.github.raw' 2>/dev/null | jq -r --arg n "$(date -u -d '+15 min' '+%Y-%m-%d %H:%M')" --arg m "$(date -u -d '-10 min' '+%Y-%m-%d %H:%M')" '[.groups[]|select(.at <= $n and .hi >= $m)|.at]|max // empty' 2>/dev/null || true)
          if [ -n "$pa" ]; then s3=$(date -u -d "$pa" +%Y-%m-%dT%H:%M:%SZ); [[ "$s3" > "$since2" ]] && since2=$s3; echo "📅 окно плана с $pa UTC (или откроется ≤ 15 мин) — пропуск только после полного прогона в окне"; fi
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/football.yml/runs?status=success&created=>=$since&per_page=20" -q "[.workflow_runs[]|select(.id != ${{ github.run_id }} and .run_started_at >= \"$since2\" and (.display_title|test(\"rehearse|research\")|not) and ((.updated_at|fromdate) - (.run_started_at|fromdate)) > 40)]|length" || echo 0)
          if [ "${n:-0}" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "⏭ экономия: полный успешный прогон за 35 мин ($n) — пропуск (пропуски не считаются: > 40 с)"; fi
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/checkout@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          sparse-checkout: |
            football
            assets
            hockey/data
      - uses: actions/setup-python@v6
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: '3.13'
      - uses: actions/cache@v4          # 14.11 экономия: готовое окружение Python вместо pip install (−10 с)
        id: pyc
        if: steps.gate.outputs.skip != 'true'
        with:
          path: ${{ env.pythonLocation }}
          key: pyenv-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('requirements-cloud.txt') }}
      - if: steps.gate.outputs.skip != 'true' && steps.pyc.outputs.cache-hit != 'true'
        run: pip install -q -r requirements-cloud.txt
      - name: Google key
        if: steps.gate.outputs.skip != 'true'
        run: printf '%s' "$GOOGLE_CREDENTIALS_JSON" > service_account.json
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
      - name: Inbox, forecast, settle
        if: steps.gate.outputs.skip != 'true'
        working-directory: football
        run: |
          if [ "${{ github.event.schedule }}" = "13 16 * * *" ]; then REHEARSE="$(TZ=Asia/Tashkent date -d tomorrow +%F),auto"; fi
          if [ -n "$REHEARSE" ]; then python rehearse.py "$REHEARSE"; else python run.py; fi
        env:
          FOOT_BOT_TOKEN: ${{ secrets.FOOT_BOT_TOKEN }}
          TENNIS_BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          FOOT_SHEET_ID: ${{ secrets.FOOT_SHEET_ID }}
          ALLOWED_USERS: ${{ secrets.ALLOWED_USERS }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          CLOUD: '1'
          RESEND_DAY: ${{ github.event.inputs.resend_day }}
          RESEND_PICKS: ${{ github.event.inputs.resend_picks }}
          RESEND_WEEK: ${{ github.event.inputs.resend_week }}
          REHEARSE: ${{ github.event.inputs.rehearse }}
      - name: Save data
        if: always() && steps.gate.outputs.skip != 'true' && github.event.inputs.rehearse == '' && github.event.schedule != '13 16 * * *'
        run: |
          git config user.name "football-bot"
          git config user.email "football-bot@users.noreply.github.com"
          git add football/data
          git diff --cached --quiet && exit 0
          git commit -m "Football data $(date -u +%F)"
          ok=0; for i in 1 2 3; do (git pull --rebase -X theirs --autostash origin main || { git rebase --abort; false; }) && git push && ok=1 && break; sleep 5; done; [ $ok = 1 ]
