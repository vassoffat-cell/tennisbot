name: probe
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Script
        run: bash probe.sh
      - name: Fetch pages
        if: false
        run: |
          mkdir -p probe
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36'
          for c in stavki xs_stavkii groznyi_ruslan kapper_uk stavki_na_sport_betting1; do
            curl -sL -A "$UA" -o probe/tg_$c.html -w "$c %{http_code} %{size_download}\n" "https://t.me/s/$c"; done
          for u in feed tennis tennis/feed tennis/events/764787-marta-kostyuk-dzhessika-pegula-prognoz-na-match Events/1568164-niderlandy-greciya-prognoz-na-match; do
            n=$(echo $u | tr '/' '_'); curl -sL -A "$UA" -H 'Accept-Language: ru' -o probe/nb_$n.html -w "$u %{http_code} %{size_download}\n" "https://nb-bet.com/$u"; done
          grep -ohE '(src|href)="[^"]*\.js[^"]*"' probe/nb_feed.html | head -20 > probe/nb_js.txt || true
      - name: Save
        run: |
          git config user.name "probe-bot"; git config user.email "probe-bot@users.noreply.github.com"
          git add probe; git commit -qm "probe pages"; for i in 1 2 3; do git pull -q --rebase -X theirs origin main && git push -q && break; sleep 5; done
