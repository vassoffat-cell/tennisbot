name: weekly
on:
  schedule:
    - cron: '23 2 * * 1,3'
  workflow_dispatch: {}
concurrency:
  group: tennis
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-cloud.txt
      - run: pip install -r requirements-cloud.txt
      - name: Google key
        run: printf '%s' "$GOOGLE_CREDENTIALS_JSON" > service_account.json
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
      - name: Retrain and forecast
        run: python autorun.py all
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ALLOWED_USERS: ${{ secrets.ALLOWED_USERS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          CLOUD: '1'
      - name: Save data and model
        run: |
          git config user.name "tennis-bot"
          git config user.email "tennis-bot@users.noreply.github.com"
          git add data state
          git diff --cached --quiet || git commit -m "Data update $(date -u +%F)"
          git pull --rebase origin main && git push
